[package]
name = "queryforge-datafusion-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
datafusion = { version = "49.0.2", default-features = false, features = ["parquet"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tonic = "0.12"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
